<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>איירון מן 2: מגן השמיים 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --stark-red: #ff1a1a;
            --stark-gold: #ffcc00;
            --stark-blue: #00d2ff;
            --stark-dark: #060913;
            --stark-sky: #bfe3ff;
            --stark-glass: rgba(6, 9, 19, 0.78);
            --neon-glow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--stark-sky);
            font-family: 'Assistant', sans-serif;
            color: #fff;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ===== Sleek Stark HUD ===== */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 100;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hud-panel {
            background: var(--stark-glass);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 12px;
            padding: 10px 16px;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .hud-left {
            display: flex;
            align-items: center;
            gap: 12px;
            border-right: 4px solid var(--stark-red);
            border-radius: 0 4px 4px 0;
        }

        .hud-right {
            text-align: right;
            border-left: 4px solid var(--stark-gold);
            border-radius: 4px 0 0 4px;
        }

        .health-bar-container {
            width: 120px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .health-bar-fill {
            height: 100%;
            width: 100%;
            background: var(--stark-blue);
            transition: width 0.2s, background-color 0.2s;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
        }

        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--stark-gold);
            text-shadow: var(--neon-glow);
        }

        .hud-flight-indicator {
            position: absolute;
            left: 20px;
            top: 90px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--stark-glass);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 210, 255, 0.15);
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff3b30;
        }

        .indicator-dot.active {
            background-color: var(--stark-blue);
            box-shadow: var(--neon-glow);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* Announcer Log */
        #announcer {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--stark-blue);
            text-shadow: 0 0 8px rgba(0,210,255,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            z-index: 90;
        }

        /* Controls Help Overlay */
        #help-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--stark-glass);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            padding: 8px 16px;
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            pointer-events: none;
            opacity: 0.85;
        }
        .help-item { display: flex; align-items: center; gap: 6px; }
        .key {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 3px;
            padding: 1px 5px;
            color: var(--stark-blue);
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
        }

        /* Mobile controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 105;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--stark-glass);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #fff;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
        }
        .touch-btn:active {
            background: rgba(0, 210, 255, 0.2);
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            #help-overlay { display: none; }
        }
    </style>
</head>
<body>

    <!-- Instantly Starting HUD -->
    <div id="hud">
        <div class="hud-top">
            <div class="hud-panel hud-left">
                <div class="hud-title">איירון מן 3D</div>
                <div class="health-bar-container">
                    <div class="health-bar-fill" id="health-fill"></div>
                </div>
            </div>
            <div class="hud-panel hud-right">
                <div class="stat-label" style="font-size:0.7rem; color:var(--stark-blue);">כורי קשת שנאספו</div>
                <div class="hud-value" id="score-val">00/15</div>
                <div id="gamepad-status" style="font-size:0.65rem; color:#ff3b30; font-weight:bold; margin-top:2px;">🎮 שלט לא מחובר</div>
            </div>
        </div>

        <div class="hud-flight-indicator">
            <div class="indicator-dot" id="flight-dot"></div>
            <span id="flight-text" style="margin-right:6px;">מערכת טיסה: כבויה (קרקע)</span>
        </div>

        <div id="help-overlay">
            <div class="help-item"><span class="key">WASD</span> תנועה</div>
            <div class="help-item"><span class="key">Space (לחיצה כפולה)</span> טיסה / ריחוף</div>
            <div class="help-item"><span class="key">F / קליק</span> ירי לייזר</div>
            <div class="help-item"><span class="key">Shift</span> מהירות</div>
        </div>
    </div>

    <!-- Announcer Log -->
    <div id="announcer">מערכת ג'רוויס מאותחלת...</div>

    <!-- Mobile Virtual Controls -->
    <div id="mobile-controls">
        <div class="touch-btn" id="btn-touch-flight">טוס</div>
        <div class="touch-btn" id="btn-touch-repulsor" style="border-color: var(--stark-gold);">דחיפה</div>
        <div class="touch-btn" id="btn-touch-shoot" style="border-color: var(--stark-red);">אש</div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Web Audio Synth for Sounds
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playLaser() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playExplosion() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }
            playCollect() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sound = new SoundEffects();

        // 3D Game Setup
        class IronManGame {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.clock = new THREE.Clock();

                // Player physical state
                this.pos = new THREE.Vector3(0, 0.5, 0);
                this.vel = new THREE.Vector3(0, 0, 0);
                this.speed = 0.16;
                this.flySpeed = 0.26;
                this.gravity = 0.008;
                this.jumpForce = 0.26;

                this.grounded = true;
                this.isFlying = false;
                this.health = 100;
                this.score = 0;
                this.maxAltitude = 45;
                this.ceilingWarned = false;

                // Repulsor shockwave ability
                this.repulsorCharge = 100;
                this.lastRepulsorTime = 0;
                this.lastGpRepulsorTime = 0;

                // Kill-combo tracking
                this.combo = 0;
                this.lastKillTime = 0;

                this.playerModel = null;
                this.keys = {};
                this.projectiles = [];
                this.enemies = [];
                this.pickups = [];
                this.particles = [];
                this.buildings = [];
                this.shockwaves = [];

                // Timings
                this.lastSpaceTime = 0;
                this.lastShootTime = 0;
                this.lastGpSpaceTime = 0;
                this.lastGpFlightTime = 0;
            }

            init() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0xbfe3ff);
                this.scene.fog = new THREE.FogExp2(0xcfeaff, 0.007);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                document.body.appendChild(this.renderer.domElement);

                // Daylight setup: sky/ground hemisphere + warm sun + soft fill
                const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6b7d63, 1.2);
                this.scene.add(hemi);

                const ambient = new THREE.AmbientLight(0xffffff, 0.8);
                this.scene.add(ambient);

                const dirLight = new THREE.DirectionalLight(0xfff2d6, 1.6);
                dirLight.position.set(30, 70, -20);
                dirLight.castShadow = true;
                this.scene.add(dirLight);

                // Environment
                this.createEnvironment();

                // Create Player
                this.createPlayer();

                // Spawn Drones and Reactors
                this.spawnReactors();
                this.spawnDrones();

                // Setup Input Listeners
                window.addEventListener('resize', () => this.onResize());
                this.setupInput();

                // Set initial camera position
                this.camera.position.set(0, 8, 12);

                this.announce("מערכות ג'רוויס מקוונות: הגנת העיר פעילה 💠");

                // Start game loop
                this.animate();
            }

            createEnvironment() {
                // Ground Grid
                const grid = new THREE.GridHelper(300, 60, 0x0090c0, 0x9fc3da);
                grid.position.y = 0.01;
                this.scene.add(grid);

                // Ground plate
                const floorGeo = new THREE.PlaneGeometry(500, 500);
                const floorMat = new THREE.MeshStandardMaterial({ color: 0xaebfca, roughness: 0.9 });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                this.scene.add(floor);

                // Build a few blocky lego buildings
                const buildColors = [0x8fa4b5, 0x9fb3c2, 0x7c93a8, 0xaebfca, 0x8aa6b8];
                const winMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.7 });

                for (let x = -90; x <= 90; x += 30) {
                    for (let z = -90; z <= 90; z += 30) {
                        if (Math.abs(x) < 15 && Math.abs(z) < 15) continue; // Safe spawn

                        const w = 8 + Math.random() * 6;
                        const h = 12 + Math.random() * 32;
                        const d = 8 + Math.random() * 6;

                        const buildMat = new THREE.MeshStandardMaterial({
                            color: buildColors[Math.floor(Math.random() * buildColors.length)],
                            metalness: 0.15,
                            roughness: 0.7
                        });
                        const bGeo = new THREE.BoxGeometry(w, h, d);
                        const bMesh = new THREE.Mesh(bGeo, buildMat);
                        bMesh.position.set(x, h/2, z);
                        bMesh.castShadow = true;
                        bMesh.receiveShadow = true;
                        this.scene.add(bMesh);

                        // Window glows
                        const winGeo = new THREE.BoxGeometry(w + 0.1, 1.0, d - 2);
                        for (let wy = 4; wy < h - 4; wy += 5) {
                            const win = new THREE.Mesh(winGeo, winMat);
                            win.position.set(0, wy - h/2, 0);
                            bMesh.add(win);
                        }

                        this.buildings.push({
                            min: new THREE.Vector3(x - w/2, 0, z - d/2),
                            max: new THREE.Vector3(x + w/2, h, z + d/2)
                        });
                    }
                }

                // Cloud ceiling: soft visual + gameplay cap on flight altitude
                const ceilingGeo = new THREE.PlaneGeometry(500, 500);
                const ceilingMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.35,
                    side: THREE.DoubleSide,
                    fog: false
                });
                this.ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
                this.ceiling.rotation.x = Math.PI / 2;
                this.ceiling.position.y = this.maxAltitude;
                this.scene.add(this.ceiling);
            }

            createPlayer() {
                this.playerModel = new THREE.Group();

                // Materials
                const redMat = new THREE.MeshStandardMaterial({ color: 0xdc143c, metalness: 0.7, roughness: 0.3 });
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.8, roughness: 0.3 });
                const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

                // Torso
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), redMat);
                torso.position.y = 0.45;
                torso.castShadow = true;
                this.playerModel.add(torso);

                // Arc Reactor
                const core = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.05, 12), glowMat);
                core.rotation.x = Math.PI/2;
                core.position.set(0, 0.6, 0.21);
                this.playerModel.add(core);

                // Head
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.45), redMat);
                head.position.y = 1.15;
                this.playerModel.add(head);

                const face = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.38, 0.05), goldMat);
                face.position.set(0, 1.15, 0.23);
                this.playerModel.add(face);

                const eyes = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.04, 0.02), glowMat);
                eyes.position.set(0, 1.2, 0.26);
                this.playerModel.add(eyes);

                // Arms
                const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.75, 0.2), redMat);
                lArm.position.set(-0.5, 0.45, 0);
                this.playerModel.add(lArm);
                this.playerModel.userData.lArm = lArm;

                const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.75, 0.2), redMat);
                rArm.position.set(0.5, 0.45, 0);
                this.playerModel.add(rArm);
                this.playerModel.userData.rArm = rArm;

                // Legs
                const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.6, 0.26), goldMat);
                lLeg.position.set(-0.2, -0.3, 0);
                this.playerModel.add(lLeg);
                this.playerModel.userData.lLeg = lLeg;

                const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.6, 0.26), goldMat);
                rLeg.position.set(0.2, -0.3, 0);
                this.playerModel.add(rLeg);
                this.playerModel.userData.rLeg = rLeg;

                this.scene.add(this.playerModel);
            }

            spawnReactors() {
                const geo = new THREE.CylinderGeometry(0.35, 0.35, 0.12, 8);
                const mat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00aaff, roughness: 0.1 });

                for (let i = 0; i < 18; i++) {
                    const rx = -110 + Math.random() * 220;
                    const rz = -110 + Math.random() * 220;
                    const ry = Math.random() > 0.4 ? 1.0 : 10 + Math.random() * 35;

                    const item = new THREE.Mesh(geo, mat);
                    item.rotation.x = Math.PI / 2;
                    item.position.set(rx, ry, rz);
                    this.scene.add(item);

                    item.userData = { pulse: Math.random() * 10, rot: 0.02 };
                    this.pickups.push(item);
                }
            }

            spawnDrones() {
                const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.2, 6);
                const mat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, emissive: 0xff0033, metalness: 0.8 });

                for (let i = 0; i < 8; i++) {
                    const dx = -80 + Math.random() * 160;
                    const dz = -80 + Math.random() * 160;
                    const dy = 5 + Math.random() * 25;

                    const drone = new THREE.Mesh(geo, mat);
                    drone.position.set(dx, dy, dz);
                    this.scene.add(drone);

                    // Rotor
                    const rotor = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.03, 0.08), new THREE.MeshBasicMaterial({ color: 0x111 }));
                    rotor.position.y = 0.12;
                    drone.add(rotor);

                    this.enemies.push({
                        mesh: drone,
                        rotor: rotor,
                        health: 20,
                        spawnPos: new THREE.Vector3(dx, dy, dz),
                        vel: new THREE.Vector3((Math.random() - 0.5) * 0.08, 0, (Math.random() - 0.5) * 0.08)
                    });
                }
            }

            setupInput() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Space') {
                        const now = Date.now();
                        if (now - this.lastSpaceTime < 260) {
                            this.toggleFlight();
                        }
                        this.lastSpaceTime = now;
                    }
                    if (e.code === 'KeyF') {
                        this.shoot();
                    }
                    if (e.code === 'KeyR') {
                        this.repulsorBlast();
                    }
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });

                window.addEventListener('mousedown', () => {
                    this.shoot();
                });

                // Mobile
                document.getElementById('btn-touch-flight').addEventListener('touchstart', () => this.toggleFlight());
                document.getElementById('btn-touch-shoot').addEventListener('touchstart', () => this.shoot());
                document.getElementById('btn-touch-repulsor').addEventListener('touchstart', () => this.repulsorBlast());
            }

            toggleFlight() {
                this.isFlying = !this.isFlying;
                const dot = document.getElementById('flight-dot');
                const txt = document.getElementById('flight-text');

                if (this.isFlying) {
                    dot.classList.add('active');
                    txt.innerText = "מערכת טיסה: פעילה (ריחוף)";
                    this.grounded = false;
                    this.vel.y = 0.1;
                    this.announce("מבערי סילון הופעלו בשחקים");
                } else {
                    dot.classList.remove('active');
                    txt.innerText = "מערכת טיסה: כבויה (קרקע)";
                    this.announce("מצב נחיתה מופעל");
                }
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShootTime < 250) return;
                this.lastShootTime = now;

                sound.playLaser();

                const pPos = this.pos.clone().add(new THREE.Vector3(0, 0.8, 0));
                const dir = new THREE.Vector3(0, 0, 1);
                if (this.playerModel) {
                    dir.applyQuaternion(this.playerModel.quaternion);
                }

                // Beam-shaped bolt instead of a plain sphere, oriented along its travel direction
                const laser = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.09, 0.5, 4, 8),
                    new THREE.MeshBasicMaterial({ color: 0x00f2fe })
                );
                laser.position.copy(pPos);
                laser.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                this.scene.add(laser);

                // Muzzle flash
                this.spawnParticles(pPos, 0x00f2fe);

                this.projectiles.push({
                    mesh: laser,
                    dir: dir.clone(),
                    speed: 0.9,
                    life: 1.5
                });
            }

            // Repulsor shockwave: knocks nearby drones back and reels pickups in - no damage, pure crowd control.
            repulsorBlast() {
                const now = Date.now();
                if (now - this.lastRepulsorTime < 1400) return;
                this.lastRepulsorTime = now;

                sound.playExplosion();
                this.spawnParticles(this.pos.clone().add(new THREE.Vector3(0, 0.6, 0)), 0xffcc00);
                this.announce("פולס ריפולסור שוחרר ⚡");

                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.5, 0.8, 32),
                    new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
                );
                ring.rotation.x = -Math.PI / 2;
                ring.position.copy(this.pos);
                ring.position.y = Math.max(0.05, this.pos.y - 0.4);
                this.scene.add(ring);
                this.shockwaves.push({ mesh: ring, life: 1.0 });

                for (const drone of this.enemies) {
                    const dx = drone.mesh.position.x - this.pos.x;
                    const dz = drone.mesh.position.z - this.pos.z;
                    const dist = Math.sqrt(dx * dx + dz * dz) || 1;
                    if (dist < 20) {
                        const force = (20 - dist) / 20 * 1.1;
                        drone.vel.x += (dx / dist) * force;
                        drone.vel.z += (dz / dist) * force;
                    }
                }

                for (const p of this.pickups) {
                    const dist = p.position.distanceTo(this.pos);
                    if (dist < 26 && dist > 2) {
                        p.position.lerp(this.pos, 0.18);
                    }
                }
            }

            spawnParticles(pos, color) {
                const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                for (let i = 0; i < 6; i++) {
                    const p = new THREE.Mesh(geo, mat);
                    p.position.copy(pos);
                    p.userData = {
                        vel: new THREE.Vector3((Math.random()-0.5)*0.15, (Math.random()-0.1)*0.15, (Math.random()-0.5)*0.15),
                        life: 1.0,
                        decay: 0.03 + Math.random()*0.02
                    };
                    this.scene.add(p);
                    this.particles.push(p);
                }
            }

            announce(msg) {
                const ann = document.getElementById('announcer');
                ann.innerText = msg;
                ann.style.opacity = '1';
                if (this.annTimeout) clearTimeout(this.annTimeout);
                this.annTimeout = setTimeout(() => ann.style.opacity = '0', 2500);
            }

            pollGamepad() {
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                const gp = gamepads[0] || gamepads[1];
                const gpStatus = document.getElementById('gamepad-status');

                if (gp) {
                    gpStatus.innerText = "🎮 שלט פלייסטיישן מחובר!";
                    gpStatus.style.color = "var(--stark-blue)";

                    // Movement
                    let x = gp.axes[0];
                    let z = gp.axes[1];
                    if (Math.abs(x) < 0.15) x = 0;
                    if (Math.abs(z) < 0.15) z = 0;

                    this.vel.x = x * (this.isFlying ? this.flySpeed : this.speed);
                    this.vel.z = z * (this.isFlying ? this.flySpeed : this.speed);

                    // Cross (0): Jump/Fly
                    if (gp.buttons[0].pressed) {
                        const now = Date.now();
                        if (now - this.lastGpSpaceTime > 300) {
                            if (now - this.lastGpSpaceTime < 500) {
                                this.toggleFlight();
                            }
                            this.lastGpSpaceTime = now;
                            if (!this.isFlying && this.grounded) {
                                this.vel.y = this.jumpForce;
                                this.grounded = false;
                            }
                        }
                    }

                    // Circle (1): Toggle Flight Directly
                    if (gp.buttons[1].pressed) {
                        const now = Date.now();
                        if (now - this.lastGpFlightTime > 400) {
                            this.lastGpFlightTime = now;
                            this.toggleFlight();
                        }
                    }

                    // Square (2): Shoot
                    if (gp.buttons[2].pressed) {
                        this.shoot();
                    }

                    // R1/R2: Fast run
                    if (gp.buttons[5].pressed || gp.buttons[7].pressed) {
                        this.keys['ShiftLeft'] = true;
                    } else {
                        this.keys['ShiftLeft'] = false;
                    }
                } else {
                    gpStatus.innerText = "🎮 שלט לא מחובר";
                    gpStatus.style.color = "#ff3b30";
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const delta = this.clock.getDelta();
                const elapsed = this.clock.getElapsedTime();

                // Gamepad
                this.pollGamepad();

                // Player physics & movement
                const runBoost = this.keys['ShiftLeft'] ? 1.6 : 1.0;
                const spd = (this.isFlying ? this.flySpeed : this.speed) * runBoost;

                let dx = 0;
                let dz = 0;
                if (this.keys['KeyW'] || this.keys['ArrowUp']) dz += spd;
                if (this.keys['KeyS'] || this.keys['ArrowDown']) dz -= spd;
                if (this.keys['KeyA'] || this.keys['ArrowLeft']) dx -= spd;
                if (this.keys['KeyD'] || this.keys['ArrowRight']) dx += spd;

                // Apply inputs if no gamepad active
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                if (!gamepads[0]) {
                    this.vel.x = dx;
                    this.vel.z = dz;

                    if (this.isFlying) {
                        let dy = 0;
                        if (this.keys['Space']) dy = spd * 0.7;
                        else if (this.keys['KeyC'] || this.keys['ControlLeft']) dy = -spd * 0.7;
                        this.vel.y = dy;
                    } else {
                        this.vel.y -= this.gravity;
                    }
                }

                this.pos.add(this.vel);

                // Altitude cap: a soft cloud ceiling keeps the city skyline in view
                if (this.pos.y > this.maxAltitude) {
                    this.pos.y = this.maxAltitude;
                    if (this.vel.y > 0) this.vel.y = 0;
                    if (!this.ceilingWarned) {
                        this.ceilingWarned = true;
                        this.announce("הגעת לתקרת הענן - זו הגובה המרבי לטיסה ☁️");
                    }
                } else if (this.pos.y < this.maxAltitude - 5) {
                    this.ceilingWarned = false;
                }

                // Floor limit
                if (this.pos.y <= 0.5) {
                    this.pos.y = 0.5;
                    this.vel.y = 0;
                    this.grounded = true;
                    if (this.isFlying) this.toggleFlight();

                    if (this.keys['Space'] && !gamepads[0]) {
                        this.vel.y = this.jumpForce;
                        this.grounded = false;
                        this.keys['Space'] = false;
                    }
                }

                // Building collisions
                for (const b of this.buildings) {
                    if (this.pos.x > b.min.x - 0.5 && this.pos.x < b.max.x + 0.5 &&
                        this.pos.z > b.min.z - 0.5 && this.pos.z < b.max.z + 0.5 &&
                        this.pos.y < b.max.y) {
                        this.pos.sub(this.vel);
                        this.vel.set(0, 0, 0);
                        this.health = Math.max(0, this.health - 2);
                        document.getElementById('health-fill').style.width = `${this.health}%`;
                        if (this.health <= 0) this.reboot();
                    }
                }

                // Bounds
                const limit = 140;
                if (Math.abs(this.pos.x) > limit || Math.abs(this.pos.z) > limit) {
                    this.pos.sub(this.vel);
                }

                // Update mesh position and rotation
                if (this.playerModel) {
                    this.playerModel.position.copy(this.pos);
                    if (Math.abs(this.vel.x) > 0.01 || Math.abs(this.vel.z) > 0.01) {
                        const angle = Math.atan2(this.vel.x, this.vel.z);
                        this.playerModel.rotation.y = angle;

                        // Leg swing animation
                        const swing = Math.sin(elapsed * 14) * 0.4;
                        if (this.playerModel.userData.lLeg) this.playerModel.userData.lLeg.rotation.x = swing;
                        if (this.playerModel.userData.rLeg) this.playerModel.userData.rLeg.rotation.x = -swing;
                    } else {
                        if (this.playerModel.userData.lLeg) this.playerModel.userData.lLeg.rotation.x = 0;
                        if (this.playerModel.userData.rLeg) this.playerModel.userData.rLeg.rotation.x = 0;
                    }

                    // Jet exhaust particles
                    if (this.isFlying || Math.abs(this.vel.x) > 0.05) {
                        this.spawnParticles(this.pos.clone().add(new THREE.Vector3(0, -0.3, 0)), 0xffa500);
                    }
                }

                // Camera follow
                this.camera.position.lerp(this.pos.clone().add(new THREE.Vector3(0, 7.5, 11)), 0.08);
                this.camera.lookAt(this.pos.clone().add(new THREE.Vector3(0, 0.8, 0)));

                // Update projectiles
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    p.mesh.position.addScaledVector(p.dir, p.speed);
                    p.life -= delta;

                    let hit = false;
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const drone = this.enemies[j];
                        if (p.mesh.position.distanceTo(drone.mesh.position) < 2.0) {
                            hit = true;
                            drone.health -= 10;
                            this.spawnParticles(drone.mesh.position, 0xff5500);
                            if (drone.health <= 0) {
                                sound.playExplosion();
                                this.scene.remove(drone.mesh);
                                this.enemies.splice(j, 1);
                                this.score += 1;
                                document.getElementById('score-val').innerText = `${this.score}/15`;
                                this.announce("רחפן אולטרון הושמד! 💥");
                                if (this.score >= 15) {
                                    this.announce("משימה הושלמה! כל הכבוד 🏆");
                                    this.score = 0;
                                    this.spawnReactors();
                                    this.spawnDrones();
                                }
                            }
                            break;
                        }
                    }

                    if (hit || p.life <= 0) {
                        this.scene.remove(p.mesh);
                        this.projectiles.splice(i, 1);
                    }
                }

                // Update drones
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const drone = this.enemies[i];
                    if (drone.rotor) drone.rotor.rotation.y += 0.25;

                    // Hover move
                    drone.mesh.position.y = drone.spawnPos.y + Math.sin(elapsed * 2 + i) * 1.5;
                    drone.mesh.position.add(drone.vel);
                    if (drone.mesh.position.distanceTo(drone.spawnPos) > 15) {
                        drone.vel.negate();
                    }

                    // Collision with player
                    if (drone.mesh.position.distanceTo(this.pos) < 2.0) {
                        this.spawnParticles(drone.mesh.position, 0xff3300);
                        this.scene.remove(drone.mesh);
                        this.enemies.splice(i, 1);
                        sound.playExplosion();
                        this.health = Math.max(0, this.health - 20);
                        document.getElementById('health-fill').style.width = `${this.health}%`;
                        this.announce("פגיעת רחפן! תיקון נזק מופעל ⚠️");
                        if (this.health <= 0) this.reboot();
                    }
                }

                // Update pickups
                for (let i = this.pickups.length - 1; i >= 0; i--) {
                    const r = this.pickups[i];
                    r.rotation.y += r.userData.rot;
                    r.position.y += Math.sin(elapsed * 4 + r.userData.pulse) * 0.003;

                    if (r.position.distanceTo(this.pos) < 1.8) {
                        sound.playCollect();
                        this.scene.remove(r);
                        this.pickups.splice(i, 1);
                        this.score += 1;
                        document.getElementById('score-val').innerText = `${this.score}/15`;
                        this.announce(`כור קשת נאסף (${this.score}/15) 💠`);
                        if (this.score >= 15) {
                            this.announce("משימה הושלמה! כל הכבוד 🏆");
                            this.score = 0;
                            this.spawnReactors();
                            this.spawnDrones();
                        }
                    }
                }

                // Update particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.position.add(p.userData.vel);
                    p.userData.life -= p.userData.decay;
                    p.scale.multiplyScalar(0.96);
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(i, 1);
                        p.geometry.dispose();
                        p.material.dispose();
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            reboot() {
                this.health = 100;
                document.getElementById('health-fill').style.width = `100%`;
                this.announce("ג'רוויס: פרוטוקול בטיחות מופעל, הליבה אותחלה! 💠");
                sound.playCollect();

                // Clear nearby drones
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const d = this.enemies[i];
                    if (d.mesh.position.distanceTo(this.pos) < 20) {
                        this.spawnParticles(d.mesh.position, 0xff3300);
                        this.scene.remove(d.mesh);
                        this.enemies.splice(i, 1);
                    }
                }
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Start instantly
        window.addEventListener('load', () => {
            const game = new IronManGame();
            game.init();
        });
    </script>
</body>
